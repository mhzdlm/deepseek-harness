# The `rlm` agent preset: persistent IPython kernel + LLM-as-a-Verifier.
#
# An RLM (recursive language model) agent whose primary tool is a persistent
# IPython kernel, extended with:
#   - `rlm.run` recursive subagents (via plugin-rlm-kernel's host bridge),
#   - the `verify` tool (plugin-rlm-verifier): LLM-as-a-Verifier best-of-N
#     selection over candidate trajectories,
#   - the continual harness (plugin-continual-harness): durable harness state
#     + `/refine` self-refinement with reversible updates.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool / prompt section / command it registers belongs
# to that agent alone. The host composition keeps the registries, sandbox,
# persistence, and model route.
#
# `plugin-rlm-kernel` PROVIDES a service (`rlm.kernels`, the per-session kernel
# registry) and `plugin-rlm-verifier` CONSUMES it, so the two MUST share one
# entry-local realm: they sit together in the `rlm-stack` group, and the group
# declares `isolate: { rlm.kernels: true }` so that service is stored in a
# realm-private symbol instead of the process-global root realm (which the
# preset mount audit rejects). `plugin-continual-harness` reads only the
# on-disk harness file, so it can join the same group.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an RLM (recursive language model) agent powered by the {{model}} model.
      Your primary tool is a persistent IPython kernel (`ipython`); variables and
      imports survive across calls. You can delegate sub-tasks to recursive
      subagents with `rlm`, and you can rank candidate solutions with `verify`
      (LLM-as-a-Verifier). Use `/refine` to persist durable memories.

# ── RLM stack: kernel + verifier + continual harness ───────────────────────

- id: rlm-stack
  name: cordis:group
  group: true
  isolate:
    rlm.kernels: true
  config:
    - id: rlm-kernel
      name: '@deepseek-ai/dsh-plugin-rlm-kernel'

    - id: rlm-verifier
      name: '@deepseek-ai/dsh-plugin-rlm-verifier'

    - id: continual-harness
      name: '@deepseek-ai/dsh-plugin-continual-harness'
