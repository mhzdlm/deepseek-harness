name: E2E (rlm plugins, DeepSeek)

# The rlm plugin e2e suite drives a real IPython kernel (uv-provisioned venv)
# against the live DeepSeek API. It spends tokens and bootstraps a kernel venv,
# so it is gated on the DEEPSEEK_API_KEY repository secret and runs nightly plus
# on demand. A nightly run without the secret FAILS LOUDLY instead of reporting
# an all-skipped green (the specs self-skip locally precisely so CI can tell
# "ran and passed" apart from "never ran").
on:
  schedule:
    # 04:17 UTC daily — off-peak for token cost and for CI runners.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: kernel + harness e2e (real kernel, real DeepSeek)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # ensureKernelPython bootstraps the kernel venv with uv on first ipython use.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. Configure the repository secret so the nightly rlm e2e suite actually runs (an all-skipped CI run is indistinguishable from no coverage)."
            exit 1
          fi

      - name: Unit tests (host mount + global-scope rendering + /refine logic)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pnpm --filter @deepseek-ai/dsh-plugin-rlm-kernel run test
          pnpm --filter @deepseek-ai/dsh-plugin-continual-harness run test

      # rlm-e2e.spec.ts (ipython tool, rlm.run depth-1 + depth-2 recursion) and
      # refine-e2e.spec.ts (/refine through the command handler) are both
      # DEEPSEEK_API_KEY-gated; the preflight step guarantees they run here.
      - name: E2E tests (real IPython kernel + real DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          pnpm --filter @deepseek-ai/dsh-plugin-rlm-kernel run test:e2e
