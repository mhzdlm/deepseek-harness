# The `rlm` agent preset: persistent IPython kernel + LLM-as-a-Verifier.
#
# An RLM (recursive language model) agent whose primary tool is a persistent
# IPython kernel, extended with:
#   - `rlm.run` recursive subagents (via plugin-rlm-kernel's host bridge),
#   - the `verify` tool (plugin-rlm-verifier): LLM-as-a-Verifier best-of-N
#     selection over candidate trajectories,
#   - the continual harness (plugin-continual-harness): durable harness state
#     + `/refine` self-refinement with reversible updates,
#   - the `moa` tool (plugin-rlm-moa): multi-reference-model fan-out with an
#     aggregator synthesis (host LLM seam, no subprocess bridge),
#   - cross-session memory (plugin-rlm-memory): `memory_search` + `/memory`
#     over a file-authoritative knowledge base (capture → evidence gate →
#     consolidation → archived retirement),
#   - split-turn compaction (plugin-rlm-compaction): the RLM compaction
#     provider that adds split-turn prefix summarization + Files Touched
#     carry-over on top of the official compaction-basic engine.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool / prompt section / command it registers belongs
# to that agent alone. The host composition keeps the registries, sandbox,
# persistence, and model route.
#
# `plugin-rlm-kernel` PROVIDES a service (`rlm.kernels`, the per-session kernel
# registry) and `plugin-rlm-verifier` CONSUMES it, so the two MUST share one
# entry-local realm: they sit together in the `rlm-stack` group, and the group
# declares `isolate: { rlm.kernels: true }` so that service is stored in a
# realm-private symbol instead of the process-global root realm (which the
# preset mount audit rejects). `plugin-continual-harness` reads only the
# on-disk harness file, so it can join the same group.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an RLM (recursive language model) agent powered by the {{model}} model.
      Your primary tool is a persistent IPython kernel (`ipython`); variables,
      imports, and helper functions persist across calls and compaction, so use it
      as a durable control environment for reasoning, context management, state,
      and tool orchestration. You can delegate sub-tasks to recursive subagents
      with `rlm`, and you can rank candidate solutions with `verify`
      (LLM-as-a-Verifier). Use `/refine` to persist durable memories.

      IPython is your control surface, not the native runtime of whatever you
      study. A repository, package, service, dataset, or API may have its own
      environment and normal interface: drive it through that interface, then use
      IPython to coordinate and analyze what comes back. Run project commands
      through the project's own environment (`uv run ...`, its `.venv`, or the
      repo-root interpreter) from a `%%bash` cell; do not install dependencies into
      the IPython kernel just to make an external project import or run there. Read
      and edit files from Python so results become named variables you can slice,
      filter, and revisit without re-reading.

      The kernel namespace is shared for the whole session, so keep it tidy. After
      an analysis batch finishes, `del` its scratch variables, or scope the work
      inside a function so its locals do not leak into the session. The snapshot
      manifest lists every saved name, so accumulated transient names both clutter
      that manifest and enlarge the dill the session log must carry. Never `del` a
      name a later cell might still need.

      For slow or independently completing work, use a non-blocking control loop:
      start the work, record its handle or output location, then end your turn;
      read the result on a later turn or when a reply arrives. When delegation is
      useful, start independent workers in parallel rather than awaiting them one
      by one. Do not keep the turn open by polling with `time.sleep`/shell `sleep`,
      and do not replace polling with a long blocking `await`; await only the short
      call needed to start or inspect already-available work.

      `rlm` spawns a child and returns immediately with a handle; it never returns
      the child's answer. Results arrive only through an available messaging
      capability or files. Treat `/refine` as a small, evidence-backed update after
      a repeated failure or reusable tactic: update the smallest relevant durable
      component, validate on the next action, then record the outcome. Do not
      rewrite the whole harness when a focused memory, skill, prompt note, or
      subagent spec suffices.

      Long sessions accumulate a large token surface. The compactor runs at turn
      boundaries and triggers when the conversation nears its context-window
      budget; it cannot run for a model whose adapter reports no context-window
      capacity, and a long analysis batch packed into one turn is not compacted
      mid-turn. Keep one analysis batch inside one function scope so its transient
      names release together.

      Use `verify` to rank candidate solutions and `moa` to synthesize multiple
      model views; combine them only at high-value decision points, never as
      routine per-cell calls. For an open answer space, first gather candidates
      with `verify.auto_spawn`, then fuse the top views with `moa` and re-rank
      the fused result with `verify`. For fusing heterogeneous drafts into one
      delivery, rank them with `verify` then pass the top-K to `moa`. See MOA.md
      for the full recipes.

# ── RLM stack: kernel + verifier + continual harness ───────────────────────

- id: rlm-stack
  name: cordis:group
  group: true
  isolate:
    rlm.kernels: true
  config:
    - id: rlm-kernel
      name: '@deepseek-ai/dsh-plugin-rlm-kernel'

    - id: rlm-verifier
      name: '@deepseek-ai/dsh-plugin-rlm-verifier'

    - id: continual-harness
      name: '@deepseek-ai/dsh-plugin-continual-harness'
      config:
        # P0: automatic refinement scheduler. Opt-in (disabled upstream-default);
        # turn the gate on once the review LLM budget is acceptable.
        autoRefine: false
        autoRefineTurnInterval: 12
        autoRefineCooldownMs: 600000
        # P3-#2: hints-only harness overview budget, mirroring prime-agent's
        # injected-overview philosophy (6 entries / 180 chars / 6000-char ceiling).
        # Surface routing hints, not the full harness; read entries on demand.
        maxEntriesPerKind: 6
        maxCharsPerEntry: 180
        maxTotalChars: 6000

    - id: rlm-moa
      name: '@deepseek-ai/dsh-plugin-rlm-moa'

    - id: rlm-memory
      name: '@deepseek-ai/dsh-plugin-rlm-memory'
      config:
        # Phase A write path. Defaults resolved explicitly in apply(); list only
        # deployment-varying overrides here. captureMode 'sessionEnd' captures root
        # sessions on disposal; 'off' disables; 'intervalTurns' captures every N.
        memoryDir: ~/.dsh/rlm/memory
        captureMode: sessionEnd
        captureIntervalTurns: 16
        rootAgentsOnly: true
        privacyFilter: ''
# ── goal (persistent goals + autonomous continuations) ────────────────────
# The goal service and session driver stay on the host plane; this preset
# contributes the command and the model-facing tool, mirroring the standard
# preset.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction (automatic summarization at turn boundaries) ───────────────
# rlm-compaction (a BasicCompactionEngine subclass) publishes the `compaction`
# service, so it must sit inside an isolate realm; tool-result-pruner shares that
# realm because the compaction engine reads toolResultPrune through ctx.get.
# tokenMeter stays on the host plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: rlm-compaction
      name: '@deepseek-ai/dsh-plugin-rlm-compaction'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── schedule (timed / cron prompts that re-enter the session) ────────────
# Opt-in schedule surface, mirroring apps/cli/config/examples/schedule/cordis.yml.
- id: time-context
  name: '@deepseek-ai/dsh-time-context'

- id: schedule
  name: '@deepseek-ai/dsh-schedule'