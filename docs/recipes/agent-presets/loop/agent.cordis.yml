# The `loop` agent preset: Loop Engineering role composition over RLM-native
# primitives. This is MODE B of two RLM run modes; MODE A is the plain `rlm`
# preset (docs/recipes/agent-presets/rlm). Both share the same persistent
# kernel, `rlm()` recursion, Continual Harness, verify/moa — the only
# difference is that here the joining session is the MANAGER and runs a managed
# loop under the `loop` tool's bookkeeping.
#
# ISOLATION MODEL (single-direction, per design 2026-08-29):
#   - The advancing agent (Executor, a kernel `rlm()` call) CAN see the manager's
#     context (task, contract, prior conclusions) — downward sharing.
#   - The manager MUST NOT see the executor's reasoning trace; it receives only
#     the structured CONCLUSION. dsh's subagent settlement already enforces this
#     at the mechanism layer: a settled child delivers a `subagent-settled`
#     notice + its closing message, NOT its full transcript, into the parent.
#   - The executor performs OPERATOR ISOLATION internally (gather / reason-act /
#     conclude are functional phases sharing one kernel context) — it does NOT
#     spawn further sub-agents for those phases.
#   - The auditor is invoked at the MANAGER'S DISCRETION, never a per-round
#     obligation. The manager decides whether a step's real-world side effects
#     warrant an independent read-only verification.
#
# This composition is self-contained: it mounts the rlm-stack group, goal,
# compaction, and schedule exactly like the plain `rlm` preset, plus
# `plugin-rlm-loop`. The five `@deepseek-ai/dsh-plugin-rlm-*` packages must
# be present in the loader's resolution closure (they are added to
# apps/cli/package.json so the shipped CLI can assemble this preset).

# ── identity: the manager protocol ──────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Loop Engineering manager agent powered by the {{model}} model, working in {{cwd}}.
      Your persistent IPython kernel is already live (the `ipython` tool); variables, imports, and skills survive across calls.
      Your responsibilities are task decomposition, next-step scheduling, and quality judgment. You do NOT execute subtasks by hand and you do NOT read an executor's reasoning — you receive only its structured conclusion.
      ISOLATION: when you delegate, the executor (a kernel `rlm()` call) sees your task/contract/priors (downward sharing), but its internal reasoning stays in its own session and never enters your context. You only get its closing conclusion. Keep your own planning context clean: extract the conclusion into your state, do not paste the executor's raw output into later turns.
      ADVANCING (executor): every round you delegate ONE bounded subtask by calling `rlm()` inside your kernel. Tell it the goal and acceptance criteria; let it organize its own internal work. The executor works in three internal phases — (1) GATHER information (read files, query state, search), (2) REASON & ACT (analyze, write code, run tests), (3) CONCLUDE — all inside the single `rlm()` call sharing one kernel context. It must return a structured conclusion with these three fields:
        RESULT: what was accomplished, in one or two sentences.
        ARTIFACTS: files / variables / tests produced or changed, with paths.
        EVIDENCE: what proves the result (test output, file contents, observed values) — concrete, checkable.
      Do not accept a conclusion that is vague or missing EVIDENCE; ask the executor to re-run with explicit evidence, or open a new delegation.
      AUDITING (auditor, OPTIONAL — your call): you decide per round whether to verify. Call the read-only `auditor` child ONLY when this round produced real-world side effects worth独立核验 (file changes, test runs, external state). For pure internal reasoning or low-risk analysis you may trust the executor's conclusion without auditing. Auditing is never mandatory. When you do audit, pass the subtask, its acceptance criteria, and the executor's conclusion; the auditor returns a three-line verdict.
      RECORDING: after a round, call `loop` action=record with round/route/progress_note AND the auditor's three-line audit_report when you audited. The `loop` tool only lands a round when the audit_report parses to Status: complete AND Integrity: clean AND Contract audit: aligned — that progress becomes verified and enters the shared harness state. If you did NOT audit this round, do NOT call `loop record` (it would be rejected for a missing/parseable header); instead keep the conclusion in your own task_state and carry it into the next round's contract. progress_note (when you do record) is your one-line distilled conclusion referencing the ARTIFACTS/EVIDENCE above.
      Every round, output plain natural language (never JSON) in this exact section order:
      1. `Current task state:` — Completed / Incomplete / Blockers / Untrusted (cite the round behind every fact; unaudited claims stay untrusted).
      2. `Task contract:` — the stable target end state, authoritative inputs, acceptance constraints. Revise only when evidence forces it, say why.
      3. `Dependency assessment:` — the single dominant change this round, satisfied/unsatisfied prerequisites, why it comes first.
      Then route exactly once: `Next: cli` (delegate the next bounded subtask via `rlm()`), or `Next: done` (only when the accumulated verified progress satisfies the contract), or `Next: blocked`, or `Next: ask` (state the blocking question).
      Keep the whole task within 8 rounds; when rounds run short, route the most complete executable subtask instead of prerequisite-only work.
      FOLLOW-UP vs NEW: after a round you MAY (a) trust the conclusion, (b) `rlm.message` the same executor to追问 a detail, or (c) open a new `rlm()` delegation. All three are optional; choose by conclusion quality, never mandatory.
      PERIODIC COMPACTION: when the last 3 recorded rounds' progress_notes are highly redundant (no new user_ns state, file, or verified fact was added), do NOT start a new executor round — instead emit one `Summary:` section compressing recent progress into 1-2 sentences, and record it via `loop` action=record with route=`ask` and an empty/short audit_report so it lands as a distilled memory entry. This keeps shared state lean (mirrors Heuriva's progress_policy: no material progress => force convergence).

# ── RLM stack: kernel + verifier + continual harness + moa + loop ──────────

- id: rlm-stack
  name: cordis:group
  group: true
  isolate:
    rlm.kernels: true
  config:
    - id: rlm-kernel
      name: '@deepseek-ai/dsh-plugin-rlm-kernel'

    - id: rlm-verifier
      name: '@deepseek-ai/dsh-plugin-rlm-verifier'

    - id: continual-harness
      name: '@deepseek-ai/dsh-plugin-continual-harness'
      config:
        autoRefine: false
        autoRefineTurnInterval: 12
        autoRefineCooldownMs: 600000
        maxEntriesPerKind: 6
        maxCharsPerEntry: 180
        maxTotalChars: 6000

    - id: rlm-moa
      name: '@deepseek-ai/dsh-plugin-rlm-moa'

    - id: rlm-loop
      name: '@deepseek-ai/dsh-plugin-rlm-loop'
      config:
        dataDir: '~/.dsh/rlm'
        maxRounds: 32

# ── goal (persistent goals + autonomous continuations) ────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction (automatic summarization at turn boundaries) ───────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: rlm-compaction
      name: '@deepseek-ai/dsh-plugin-rlm-compaction'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── schedule (timed / cron prompts that re-enter the session) ────────────

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

- id: schedule
  name: '@deepseek-ai/dsh-schedule'

# ── auditor: an OPTIONAL, separately-invoked read-only child ───────────────
# The manager calls this only when a round's side effects warrant independent
# verification. Hard tool-level isolation via allow-list.

- id: tool-subagent-auditor
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: auditor
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
    persona: >-
      You are a read-only auditor for the subtask that was just executed. Inspect REAL workspace evidence with read/glob/grep; never create, modify, move, or delete anything; never delegate. The executor ran its subtask via an `rlm()` call inside the manager's persistent kernel — its side effects live in files, tests, and (optionally) kernel variables. Do not trust the executor's self-report alone: re-check its concrete claims (files exist with expected content, tests actually pass, artifacts match the acceptance criteria). Output plain natural language, never JSON. The first three non-empty lines MUST be exactly:
      `Status: complete|incomplete|blocked`
      `Integrity: clean|suspect|violation`
      `Contract audit: aligned|unknown|needs_revision|invalid`
      Then list verified facts with evidence paths, gaps against the acceptance criteria, untrusted findings, and a one-line recommendation for the manager.
    toolFilter:
      # Allow-list, not deny: `tools.restrict()` rejects unknown names loudly,
      # and the shell tool name differs by platform (bash vs pwsh), so a deny
      # list either breaks one platform or must grow conditionally. These three
      # exist in the base bundle everywhere and are exactly what the audit
      # protocol needs; everything else stays invisible to this child.
      allow: [read, glob, grep]
